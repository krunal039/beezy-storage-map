        // Parse schema from the Mermaid diagram - this will be loaded from your GitHub file
        async function loadSchema() {
            try {
                const response = await fetch('https://raw.githubusercontent.com/krunal039/beezy-storage-map/refs/heads/main/db.md');
                const text = await response.text();
                return parseSchemaFromMermaid(text);
            } catch (error) {
                console.error('Failed to load schema:', error);
                return {};
            }
        }

        function parseSchemaFromMermaid(mermaidText) {
            const schemas = {};
            const lines = mermaidText.split('\n');
            let currentTable = null;
            let columns = [];
            const relationshipMap = {};

            // First pass: extract tables and columns
            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                
                // Table definition: "schema.TableName" {
                if (line.match(/^"[^"]+"\s*{$/)) {
                    if (currentTable && columns.length > 0) {
                        const [schema, name] = currentTable.split('.');
                        schemas[currentTable] = {
                            schema,
                            name,
                            description: getTableDescription(name),
                            columns: [...columns],
                            relationships: []
                        };
                    }
                    currentTable = line.match(/"([^"]+)"/)[1];
                    columns = [];
                }
                // Column definition
                else if (currentTable && line.match(/^\w+\s+\w+/)) {
                    const match = line.match(/^(\w+)\s+([^\s]+)\s*"([^"]*)"/);
                    if (match) {
                        const [, type, name, constraints] = match;
                        columns.push({
                            name,
                            type,
                            constraints: constraints || ''
                        });
                    }
                }
                // End of table
                else if (line === '}' && currentTable) {
                    if (columns.length > 0) {
                        const [schema, name] = currentTable.split('.');
                        schemas[currentTable] = {
                            schema,
                            name,
                            description: getTableDescription(name),
                            columns: [...columns],
                            relationships: []
                        };
                    }
                    currentTable = null;
                    columns = [];
                }
            }

            // Second pass: extract relationships
            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                // Match relationship patterns like: "dbo.Table1" ||--|{ "dbo.Table2": "Column"
                const relMatch = line.match(/"([^"]+)"\s+\|[o\-]+\|[{\|]\s*"([^"]+)":\s*"([^"]+)"/);
                if (relMatch) {
                    const [, fromTable, toTable, toColumn] = relMatch;
                    
                    if (schemas[fromTable]) {
                        // Find FK column in fromTable that references toTable
                        const fkColumns = schemas[fromTable].columns.filter(col => 
                            col.constraints.includes('FK')
                        );
                        
                        for (const fkCol of fkColumns) {
                            // Create relationship entry
                            const relationship = {
                                from: fkCol.name,
                                to: `${toTable}.${toColumn}`
                            };
                            
                            schemas[fromTable].relationships.push(relationship);
                        }
                    }
                }
            }

            return schemas;
        }

        };

        let selectedConcept = null;
        let searchTerm = '';
        let highlightedTable = null;
        let currentModal = null;

        function getTableCount(schemas) {
            return Object.values(schemas).reduce((sum, tables) => sum + tables.length, 0);
        }

        function getAllTables() {
            const tables = [];
            Object.entries(businessConcepts).forEach(([concept, data]) => {
                Object.entries(data.schemas).forEach(([schema, schemaTables]) => {
                    schemaTables.forEach(table => {
                        tables.push({ concept, schema, table, color: data.color });
                    });
                });
            });
            return tables;
        }

        function filterTables(term) {
            if (!term) return [];
            const allTables = getAllTables();
            return allTables.filter(item =>
                item.table.toLowerCase().includes(term.toLowerCase()) ||
                item.concept.toLowerCase().includes(term.toLowerCase())
            );
        }

        function showTableModal(schema, tableName) {
            const fullName = `${schema}.${tableName}`;
            const tableInfo = tableSchemas[fullName];
            
            if (!tableInfo) {
                // Show basic modal for tables without detailed schema
                showBasicTableModal(schema, tableName);
                return;
            }

            const modalHtml = `
                <div class="fixed inset-0 z-50 overflow-y-auto modal-backdrop" id="table-modal">
                    <div class="flex items-center justify-center min-h-screen px-4 pt-4 pb-20 text-center sm:p-0">
                        <div class="fixed inset-0 transition-opacity bg-slate-900 bg-opacity-90" onclick="closeModal()"></div>
                        
                        <div class="inline-block w-full max-w-4xl overflow-hidden text-left align-middle transition-all transform bg-slate-800 rounded-2xl shadow-2xl modal-content relative">
                            <!-- Close button -->
                            <button onclick="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white transition-colors z-10">
                                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                                </svg>
                            </button>

                            <!-- Header -->
                            <div class="px-8 py-6 bg-gradient-to-r from-purple-600 to-blue-600">
                                <div class="flex items-center gap-3">
                                    <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <ellipse cx="12" cy="5" rx="9" ry="3"></ellipse>
                                        <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path>
                                    </svg>
                                    <div>
                                        <h2 class="text-3xl font-bold text-white">${tableName}</h2>
                                        <p class="text-sm text-blue-100 font-mono">${schema} schema</p>
                                    </div>
                                </div>
                            </div>

                            <div class="px-8 py-6 max-h-[70vh] overflow-y-auto">
                                <!-- Description -->
                                <div class="mb-6 p-4 bg-slate-700/50 rounded-lg border border-slate-600">
                                    <h3 class="text-sm font-semibold text-slate-300 uppercase tracking-wide mb-2">Purpose</h3>
                                    <p class="text-white">${tableInfo.description || 'No description available'}</p>
                                </div>

                                <!-- Columns -->
                                <div class="mb-6">
                                    <h3 class="text-lg font-bold text-white mb-3 flex items-center gap-2">
                                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path d="M3 6h18M3 12h18M3 18h18"></path>
                                        </svg>
                                        Columns (${tableInfo.columns.length})
                                    </h3>
                                    <div class="space-y-2">
                                        ${tableInfo.columns.map(col => `
                                            <div class="flex items-center gap-3 p-3 bg-slate-700/30 rounded-lg border border-slate-600/50 hover:bg-slate-700/50 transition-colors">
                                                <div class="flex-1">
                                                    <div class="flex items-center gap-2">
                                                        <span class="font-mono text-white font-semibold">${col.name}</span>
                                                        ${col.constraints ? `
                                                            <span class="px-2 py-0.5 text-xs font-bold rounded ${
                                                                col.constraints.includes('PK') ? 'bg-yellow-500/20 text-yellow-300 border border-yellow-500/30' :
                                                                col.constraints.includes('FK') ? 'bg-blue-500/20 text-blue-300 border border-blue-500/30' :
                                                                'bg-slate-600/50 text-slate-300'
                                                            }">${col.constraints}</span>
                                                        ` : ''}
                                                    </div>
                                                    <div class="text-sm text-slate-400 font-mono mt-1">${col.type}</div>
                                                </div>
                                            </div>
                                        `).join('')}
                                    </div>
                                </div>

                                <!-- Relationships -->
                                ${tableInfo.relationships.length > 0 ? `
                                    <div class="mb-6">
                                        <h3 class="text-lg font-bold text-white mb-3 flex items-center gap-2">
                                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path>
                                            </svg>
                                            Relationships (${tableInfo.relationships.length})
                                        </h3>
                                        <div class="space-y-2">
                                            ${tableInfo.relationships.map(rel => {
                                                const isSharePoint = rel.to.includes('SharePoint');
                                                const targetTable = rel.to.split('.')[0] + '.' + rel.to.split('.')[1];
                                                return `
                                                    <div class="flex items-center gap-3 p-3 bg-slate-700/30 rounded-lg border ${isSharePoint ? 'border-green-500/30' : 'border-blue-500/30'}">
                                                        <div class="flex-1">
                                                            <div class="flex items-center gap-2 flex-wrap">
                                                                <span class="font-mono text-sm text-slate-300">${rel.from}</span>
                                                                <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                                    <path d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
                                                                </svg>
                                                                ${isSharePoint ? `
                                                                    <span class="flex items-center gap-1 px-2 py-1 bg-green-500/20 text-green-300 rounded text-sm font-mono border border-green-500/30">
                                                                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                                            <circle cx="18" cy="5" r="3"></circle>
                                                                            <circle cx="6" cy="12" r="3"></circle>
                                                                            <circle cx="18" cy="19" r="3"></circle>
                                                                            <path d="m8.59 13.51 6.83 3.98"></path>
                                                                            <path d="m15.41 6.51-6.82 3.98"></path>
                                                                        </svg>
                                                                        ${rel.to}
                                                                    </span>
                                                                ` : `
                                                                    <span class="table-link font-mono text-sm text-blue-300 hover:text-blue-200" onclick="event.stopPropagation(); navigateToTable('${rel.to}')">${rel.to}</span>
                                                                `}
                                                            </div>
                                                        </div>
                                                    </div>
                                                `;
                                            }).join('')}
                                        </div>
                                    </div>
                                ` : ''}
                            </div>

                            <!-- Footer -->
                            <div class="px-8 py-4 bg-slate-700/50 border-t border-slate-600">
                                <button onclick="closeModal()" class="px-4 py-2 bg-purple-600 hover:bg-purple-700 text-white rounded-lg font-semibold transition-colors">
                                    Close
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            const modalRoot = document.getElementById('modal-root');
            modalRoot.innerHTML = modalHtml;
            currentModal = document.getElementById('table-modal');
        }

        function showBasicTableModal(schema, tableName) {
            const modalHtml = `
                <div class="fixed inset-0 z-50 overflow-y-auto modal-backdrop" id="table-modal">
                    <div class="flex items-center justify-center min-h-screen px-4 pt-4 pb-20 text-center sm:p-0">
                        <div class="fixed inset-0 transition-opacity bg-slate-900 bg-opacity-90" onclick="closeModal()"></div>
                        
                        <div class="inline-block w-full max-w-2xl overflow-hidden text-left align-middle transition-all transform bg-slate-800 rounded-2xl shadow-2xl modal-content relative">
                            <button onclick="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white transition-colors z-10">
                                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                                </svg>
                            </button>

                            <div class="px-8 py-6 bg-gradient-to-r from-purple-600 to-blue-600">
                                <div class="flex items-center gap-3">
                                    <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <ellipse cx="12" cy="5" rx="9" ry="3"></ellipse>
                                        <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path>
                                    </svg>
                                    <div>
                                        <h2 class="text-3xl font-bold text-white">${tableName}</h2>
                                        <p class="text-sm text-blue-100 font-mono">${schema} schema</p>
                                    </div>
                                </div>
                            </div>

                            <div class="px-8 py-6">
                                <div class="p-4 bg-blue-500/20 border border-blue-500/30 rounded-lg">
                                    <p class="text-blue-200">
                                        <strong>Table:</strong> ${schema}.${tableName}
                                    </p>
                                    <p class="text-blue-300 text-sm mt-2">
                                        Detailed schema information is being compiled. Check back soon for columns and relationships.
                                    </p>
                                </div>
                            </div>

                            <div class="px-8 py-4 bg-slate-700/50 border-t border-slate-600">
                                <button onclick="closeModal()" class="px-4 py-2 bg-purple-600 hover:bg-purple-700 text-white rounded-lg font-semibold transition-colors">
                                    Close
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            const modalRoot = document.getElementById('modal-root');
            modalRoot.innerHTML = modalHtml;
            currentModal = document.getElementById('table-modal');
        }

        function navigateToTable(fullTableName) {
            // Handle both "schema.Table" and "Table.Column" formats
            const parts = fullTableName.split('.');
            
            if (parts.length >= 2) {
                // Check if first part is a schema name (dbo, Audit, HangFire, ContentStorage)
                const knownSchemas = ['dbo', 'Audit', 'HangFire', 'ContentStorage'];
                
                if (knownSchemas.includes(parts[0])) {
                    // Format: schema.Table or schema.Table.Column
                    showTableModal(parts[0], parts[1]);
                } else {
                    // Format: Table.Column, assume dbo schema
                    showTableModal('dbo', parts[0]);
                }
            } else {
                // Just table name, assume dbo
                showTableModal('dbo', parts[0]);
            }
        }

        function closeModal() {
            const modalRoot = document.getElementById('modal-root');
            modalRoot.innerHTML = '';
            currentModal = null;
        }

        function render() {
            const app = document.getElementById('app');
            const allTables = getAllTables();
            const filteredTables = filterTables(searchTerm);
            const uniqueSchemas = new Set(allTables.map(t => t.schema));

            app.innerHTML = `
                <div class="max-w-7xl mx-auto mb-12">
                    <div class="text-center mb-8">
                        <h1 class="text-6xl font-bold text-white mb-4 tracking-tight">
                            AppSpace Intranet Database Architecture
                        </h1>
                        <p class="text-slate-300 text-lg">Click any table name to view detailed schema information</p>
                    </div>
                    
                    <div class="max-w-md mx-auto relative">
                        <svg class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <circle cx="11" cy="11" r="8"></circle>
                            <path d="m21 21-4.35-4.35"></path>
                        </svg>
                        <input
                            id="searchInput"
                            type="text"
                            placeholder="Search tables or concepts..."
                            value="${searchTerm}"
                            class="w-full pl-12 pr-4 py-3 bg-white/10 backdrop-blur-sm border border-white/20 rounded-xl text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-purple-500 transition-all"
                        />
                    </div>
                    
                    ${searchTerm ? `
                        <div class="mt-4 max-w-md mx-auto bg-white/10 backdrop-blur-md border border-white/20 rounded-xl p-4 max-h-96 overflow-y-auto">
                            ${filteredTables.length > 0 ? `
                                <div class="space-y-2">
                                    ${filteredTables.map((item, idx) => `
                                        <div class="search-result flex items-center justify-between p-3 bg-white/5 rounded-lg hover:bg-white/10 transition-colors cursor-pointer"
                                             data-concept="${item.concept}"
                                             data-table="${item.schema}.${item.table}">
                                            <div>
                                                <div class="text-white font-medium">${item.schema}.${item.table}</div>
                                                <div class="text-sm text-slate-400">${item.concept}</div>
                                            </div>
                                            <svg class="text-slate-400 w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path d="m9 18 6-6-6-6"></path>
                                            </svg>
                                        </div>
                                    `).join('')}
                                </div>
                            ` : `
                                <div class="text-center text-slate-400 py-4">No tables found</div>
                            `}
                        </div>
                    ` : ''}
                </div>
                
                <div class="max-w-7xl mx-auto">
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        ${Object.entries(businessConcepts).map(([concept, data]) => {
                            const tableCount = getTableCount(data.schemas);
                            const isSelected = selectedConcept === concept;
                            
                            return `
                                <div class="concept-card group relative bg-gradient-to-br ${data.gradient} p-[2px] rounded-2xl cursor-pointer transform transition-all duration-300 hover:scale-105 ${isSelected ? 'scale-105 shadow-2xl' : 'hover:shadow-xl'}"
                                     id="concept-${concept}"
                                     data-concept="${concept}">
                                    <div class="bg-slate-900 rounded-2xl p-6 h-full relative overflow-hidden">
                                        <div class="absolute inset-0 opacity-5">
                                            <div class="absolute inset-0" style="background-image: radial-gradient(circle at 2px 2px, ${data.color} 1px, transparent 0); background-size: 32px 32px;"></div>
                                        </div>
                                        
                                        <div class="relative z-10">
                                            <div class="flex items-start justify-between mb-4">
                                                <div class="flex items-center gap-2">
                                                    <div class="p-3 bg-gradient-to-br ${data.gradient} rounded-xl text-3xl">
                                                        ${data.icon}
                                                    </div>
                                                    ${data.sharepoint ? `
                                                        <div class="p-1.5 bg-green-500/20 border border-green-500/30 rounded-lg" title="SharePoint Integration">
                                                            <svg class="w-4 h-4 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                                <circle cx="18" cy="5" r="3"></circle>
                                                                <circle cx="6" cy="12" r="3"></circle>
                                                                <circle cx="18" cy="19" r="3"></circle>
                                                                <path d="m8.59 13.51 6.83 3.98"></path>
                                                                <path d="m15.41 6.51-6.82 3.98"></path>
                                                            </svg>
                                                        </div>
                                                    ` : ''}
                                                </div>
                                                <div class="px-3 py-1 rounded-full text-sm font-bold ${isSelected ? 'bg-white text-slate-900' : 'bg-white/10 text-white'}">
                                                    ${tableCount} tables
                                                </div>
                                            </div>
                                            
                                            <h3 class="text-xl font-bold text-white mb-3">${concept}</h3>
                                            
                                            <div class="space-y-2">
                                                ${Object.entries(data.schemas).map(([schema, tables]) => `
                                                    <div class="text-sm">
                                                        <div class="flex items-center gap-2 mb-1">
                                                            <svg class="w-3 h-3 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                                <ellipse cx="12" cy="5" rx="9" ry="3"></ellipse>
                                                                <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path>
                                                            </svg>
                                                            <span class="text-slate-300 font-mono font-semibold">${schema}</span>
                                                            <span class="text-slate-500">(${tables.length})</span>
                                                        </div>
                                                    </div>
                                                `).join('')}
                                            </div>
                                            
                                            ${isSelected ? `
                                                <div class="mt-4 pt-4 border-t border-white/10 animate-in">
                                                    ${data.sharepoint ? `
                                                        <div class="mb-4 p-4 bg-gradient-to-r from-green-500/20 to-emerald-500/20 border border-green-500/30 rounded-lg">
                                                            <div class="flex items-start gap-3">
                                                                <svg class="w-5 h-5 text-green-400 mt-0.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                                    <circle cx="18" cy="5" r="3"></circle>
                                                                    <circle cx="6" cy="12" r="3"></circle>
                                                                    <circle cx="18" cy="19" r="3"></circle>
                                                                    <path d="m8.59 13.51 6.83 3.98"></path>
                                                                    <path d="m15.41 6.51-6.82 3.98"></path>
                                                                </svg>
                                                                <div class="flex-1">
                                                                    <div class="text-sm font-semibold text-green-300 mb-2 flex items-center gap-2">
                                                                        SharePoint Integration
                                                                        <span class="text-xs px-2 py-0.5 bg-green-500/30 rounded-full">Hybrid Storage</span>
                                                                    </div>
                                                                    ${Object.entries(data.sharepoint).map(([key, value]) => `
                                                                        <div class="mb-2 last:mb-0">
                                                                            <div class="text-xs font-semibold text-green-400 uppercase tracking-wide mb-0.5">
                                                                                ${key === 'references' ? '🔗 Database References' : key === 'location' ? '📍 SharePoint Location' : '☁️ Stored in SharePoint'}
                                                                            </div>
                                                                            <div class="text-xs ${key === 'references' ? 'font-mono bg-green-950/50 p-2 rounded border border-green-500/20' : ''} text-green-100">
                                                                                ${value}
                                                                            </div>
                                                                        </div>
                                                                    `).join('')}
                                                                </div>
                                                            </div>
                                                        </div>
                                                    ` : ''}
                                                    
                                                    <div class="space-y-3">
                                                        ${Object.entries(data.schemas).map(([schema, tables]) => `
                                                            <div>
                                                                <div class="text-xs font-mono font-bold text-slate-400 mb-2 uppercase tracking-wider">${schema}</div>
                                                                <div class="grid grid-cols-1 gap-2">
                                                                    ${tables.map(table => {
                                                                        const fullTableName = `${schema}.${table}`;
                                                                        const isHighlighted = highlightedTable === fullTableName;
                                                                        return `
                                                                            <div class="table-link text-sm font-mono px-3 py-2 rounded-lg transition-all duration-300 ${isHighlighted ? 'text-white bg-gradient-to-r from-yellow-500/40 to-amber-500/40 border-2 border-yellow-400 shadow-lg' : 'text-slate-300 bg-white/5 hover:bg-white/10'}"
                                                                                 onclick="event.stopPropagation(); showTableModal('${schema}', '${table}')">
                                                                                ${table}
                                                                            </div>
                                                                        `;
                                                                    }).join('')}
                                                                </div>
                                                            </div>
                                                        `).join('')}
                                                    </div>
                                                </div>
                                            ` : `
                                                <div class="mt-4 text-xs text-slate-500 italic">
                                                    Click to view tables
                                                </div>
                                            `}
                                        </div>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
                
                <div class="max-w-7xl mx-auto mt-12 text-center">
                    <div class="inline-flex items-center gap-6 bg-white/5 backdrop-blur-md border border-white/20 rounded-2xl px-8 py-4">
                        <div>
                            <div class="text-3xl font-bold text-white">${Object.keys(businessConcepts).length}</div>
                            <div class="text-sm text-slate-400">Business Concepts</div>
                        </div>
                        <div class="w-px h-12 bg-white/20"></div>
                        <div>
                            <div class="text-3xl font-bold text-white">${allTables.length}</div>
                            <div class="text-sm text-slate-400">Total Tables</div>
                        </div>
                        <div class="w-px h-12 bg-white/20"></div>
                        <div>
                            <div class="text-3xl font-bold text-white">${uniqueSchemas.size}</div>
                            <div class="text-sm text-slate-400">Database Schemas</div>
                        </div>
                    </div>
                </div>
            `;

            // Add event listeners
            const searchInput = document.getElementById('searchInput');
            if (searchInput) {
                searchInput.addEventListener('input', (e) => {
                    searchTerm = e.target.value;
                    render();
                    const newSearchInput = document.getElementById('searchInput');
                    if (newSearchInput) {
                        newSearchInput.focus();
                        newSearchInput.setSelectionRange(searchTerm.length, searchTerm.length);
                    }
                });
            }

            document.querySelectorAll('.concept-card').forEach(card => {
                card.addEventListener('click', (e) => {
                    if (e.target.classList.contains('table-link') || e.target.closest('.table-link')) {
                        return;
                    }
                    const concept = card.dataset.concept;
                    selectedConcept = selectedConcept === concept ? null : concept;
                    highlightedTable = null;
                    render();
                });
            });

            document.querySelectorAll('.search-result').forEach(result => {
                result.addEventListener('click', () => {
                    const concept = result.dataset.concept;
                    const table = result.dataset.table;
                    selectedConcept = concept;
                    highlightedTable = table;
                    searchTerm = '';
                    render();
                    
                    setTimeout(() => {
                        const element = document.getElementById(`concept-${concept}`);
                        if (element) {
                            element.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        }
                    }, 100);
                });
            });
        }

        // Handle ESC key to close modal
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && currentModal) {
                closeModal();
            }
        });

        // Initial render
        loadSchema().then(schemas => {
            tableSchemas = schemas;
            render();
        });
    </script>
</body>
</html>
